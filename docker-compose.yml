services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paygate
      POSTGRES_PASSWORD: paygate
      POSTGRES_DB: paygate
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygate -d paygate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py"
    environment:
      DATABASE_URL: postgresql+asyncpg://paygate:paygate@postgres:5432/paygate
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: compose-dev-secret-change-me
      ENVIRONMENT: development
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://paygate:paygate@postgres:5432/paygate
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: compose-dev-secret-change-me
      ENVIRONMENT: development
      FRAUD_MODEL_PATH: artifacts/fraud_model.joblib
      RATE_LIMIT_REQUESTS: "10000"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.webhooks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://paygate:paygate@postgres:5432/paygate
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: compose-dev-secret-change-me
      ENVIRONMENT: development
      FRAUD_MODEL_PATH: artifacts/fraud_model.joblib
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: paygate
      POSTGRES_PASSWORD: paygate
      POSTGRES_DB: paygate_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygate -d paygate_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
